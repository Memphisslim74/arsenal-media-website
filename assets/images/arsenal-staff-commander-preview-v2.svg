<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"><title>Arsenal Staff Commander preview</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07080b"/><stop offset=".75" stop-color="#111722"/><stop offset="1" stop-color="#3a0d14"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#d71920"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif}.w{fill:#f8fafc}.m{fill:#aeb8c8}.panel{fill:#1a202b;stroke:#3c4553;stroke-width:1.5}.side{fill:#10161f}.white{fill:#fff}.btn{fill:#eef0f3}.red{fill:#d71920}.card{fill:#252c37;stroke:#464f5e;stroke-width:1}.h{font-size:42px;font-weight:900;letter-spacing:-1.4px}.s{font-size:14px;font-weight:800}.xs{font-size:11px;font-weight:900;letter-spacing:.08em}.num{font-size:32px;font-weight:900}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="82" rx="18" fill="#080c12" stroke="#384152"/><text class="t w" x="58" y="79" font-size="34" font-weight="900">Arsenal Staff Commander</text><text class="t m xs" x="58" y="98">OPERATIONS AND TRAINING COMMAND CENTER</text><rect x="28" y="136" width="190" height="570" rx="18" class="side" stroke="#384152"/><g transform="translate(48 160)"><rect class="btn" width="150" height="31" rx="7"/><text class="t" x="13" y="21" fill="#111827" font-size="13" font-weight="900">Operations</text><rect class="btn" y="44" width="150" height="31" rx="7"/><text class="t" x="13" y="65" fill="#111827" font-size="13" font-weight="900">Submissions</text><rect class="btn" y="88" width="150" height="31" rx="7"/><text class="t" x="13" y="109" fill="#111827" font-size="13" font-weight="900">Approvals</text><rect class="btn" y="132" width="150" height="31" rx="7"/><text class="t" x="13" y="153" fill="#111827" font-size="13" font-weight="900">Team Payroll</text><rect class="btn" y="176" width="150" height="31" rx="7"/><text class="t" x="13" y="197" fill="#111827" font-size="13" font-weight="900">Training</text><rect class="btn" y="220" width="150" height="31" rx="7"/><text class="t" x="13" y="241" fill="#111827" font-size="13" font-weight="900">Reports</text></g><rect x="242" y="136" width="930" height="230" rx="18" class="panel"/><text class="t m xs" x="270" y="176">OPERATIONS DASHBOARD</text><text class="t w h" x="270" y="225">One place for staff operations,</text><text class="t w h" x="270" y="275">approvals, payroll, and training.</text><text class="t m" x="270" y="312" font-size="17">Role-aware visibility across staff records, training, submissions, and reports.</text><g transform="translate(760 170)"><rect class="card" width="350" height="56" rx="12"/><text class="t w s" x="18" y="25">Fully white-labeled</text><text class="t m" x="18" y="44" font-size="12">No production data or real credentials.</text><rect class="card" y="72" width="350" height="56" rx="12"/><text class="t w s" x="18" y="97">Role-aware views</text><text class="t m" x="18" y="116" font-size="12">Owner, Manager, and Team Member modes.</text></g><g transform="translate(242 394)"><rect class="white" width="150" height="74" rx="12"/><text class="t m xs" x="16" y="25">SUBMISSIONS</text><text class="t num" x="16" y="58" fill="#111827">5</text><rect class="white" x="164" width="150" height="74" rx="12"/><text class="t m xs" x="180" y="25">PENDING</text><text class="t num" x="180" y="58" fill="#111827">2</text><rect class="white" x="328" width="150" height="74" rx="12"/><text class="t m xs" x="344" y="25">APPROVED</text><text class="t num" x="344" y="58" fill="#111827">2</text><rect class="white" x="492" width="170" height="74" rx="12"/><text class="t m xs" x="508" y="25">TOTAL PAY</text><text class="t num" x="508" y="58" fill="#111827">$1,390</text><rect class="white" x="676" width="150" height="74" rx="12"/><text class="t m xs" x="692" y="25">TRAINING</text><text class="t num" x="692" y="58" fill="#111827">75%</text></g><rect x="242" y="500" width