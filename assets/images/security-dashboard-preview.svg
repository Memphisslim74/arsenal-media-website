<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Security operations dashboard preview</title><desc id="desc">Dark operations dashboard preview with status, exceptions, requests, and leadership review cards.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07080b"/><stop offset=".7" stop-color="#111722"/><stop offset="1" stop-color="#330b13"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#d71920"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif}.white{fill:#f8fafc}.muted{fill:#aeb8c8}.panel{fill:#1a202b;stroke:#3b4351;stroke-width:1.5}.card{fill:#252c37;stroke:#4b5563}.red{fill:#d71920}.green{fill:#22c55e}.gold{fill:#f59e0b}.xs{font-size:10px;font-weight:900;letter-spacing:.08em}.h1{font-size:44px;font-weight:900;letter-spacing:-1.8px}.h2{font-size:22px;font-weight:900}.small{font-size:13px;font-weight:800}</style></defs><rect width="1200" height="760" fill="url(#bg)"/><text class="t white h1" x="56" y="92">Security Operations Dashboard</text><text class="t muted" x="56" y="124" font-size="18">Operational visibility for requests, exceptions, status, and leadership review.</text><rect class="panel" x="56" y="170" width="250" height="520" rx="18"/><text class="t white h2" x="86" y="220">Navigation</text><g transform="translate(86 252)"><rect x="0" y="0" width="180" height="36" rx="8" fill="#fff"/><text class="t" x="18" y="24" fill="#111827" font-size="13" font-weight="900">Dashboard</text><rect x="0" y="52" width="180" height="36" rx="8" fill="#d71920"/><text class="t white" x="18" y="76" font-size="13" font-weight="900">Exceptions</text><rect x="0" y="104" width="180" height="36" rx="8" fill="#fff"/><text class="t" x="18" y="128" fill="#111827" font-size="13" font-weight="900">Requests</text><rect x="0" y="156" width="180" height="36" rx="8" fill="#fff"/><text class="t" x="18" y="180" fill="#111827" font-size="13" font-weight="900">Leadership Review</text></g><rect class="panel" x="336" y="170" width="808" height="216" rx="18"/><text class="t muted xs" x="366" y="210">OPERATIONS VISIBILITY</text><text class="t white h1" x="366" y="266">Requests, exceptions, and status</text><text class="t white h1" x="366" y="316">in one command center.</text><g transform="translate(366 420)"><rect fill="#fff" width="150" height="76" rx="12"/><text class="t muted xs" x="16" y="24">OPEN REQUESTS</text><text class="t" fill="#111827" x="16" y="56" font-size="30" font-weight="900">18</text><rect fill="#fff" x="166" width="150" height="76" rx="12"/><text class="t muted xs" x="182" y="24">EXCEPTIONS</text><text class="t" fill="#111827" x="182" y="56" font-size="30" font-weight="900">4</text><rect fill="#fff" x="332" width="150" height="76" rx="12"/><text class="t muted xs" x="348" y="24">READY</text><text class="t" fill="#111827" x="348" y="56" font-size="30" font-weight="900">12</text><rect fill="#fff" x="498" width="150" height="76" rx="12"/><text class="t muted xs" x="514" y="24">REVIEW</text><text class="t" fill="#111827" x="514" y="56" font-size="30" font-weight="900">6</text></g><rect class="panel" x="336" y="526" width="390" height="164" rx="16"/><text class="t white h2" x="364" y="566">Exception Status</text><rect x="364" y="594" width="280" height="10" rx="5" fill="#4b5563"/><rect x="364" y="594" width="188" height="10" rx="5" fill="url(#bar)"/><rect x="364" y="628" width="280" height="10" rx="5" fill="#4b5563"/><rect x="364" y="628" width="116" height="10" rx="5" fill="url(#bar)"/><rect class="panel" x="754" y="526" width="390" height="164" rx="16"/><text class="t white h2" x="782" y="566">Leadership Review</text><text class="t muted" x="782" y="600" font-size="15">• Exceptions needing approval</text><text class="t muted" x="782" y="630" font-size="15">• Requests waiting on status</text><text class="t muted" x="782" y="660" font-size="15">• Action items for today</text></svg>