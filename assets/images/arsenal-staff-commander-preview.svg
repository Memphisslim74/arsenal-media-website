<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Arsenal Staff Commander dashboard preview</title>
<desc id="desc">A dark Arsenal Media app interface showing staff operations, approvals, payroll, employee training, people, integrations, and reports.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07080b"/><stop offset=".62" stop-color="#111722"/><stop offset="1" stop-color="#350b12"/></linearGradient>
<linearGradient id="redblue" x1="0" x2="1"><stop stop-color="#d71920"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
<style>.t{font-family:Inter,Arial,sans-serif}.white{fill:#f8fafc}.muted{fill:#aeb8c8}.red{fill:#d71920}.panel{fill:#151b25;stroke:#343b48;stroke-width:1.5}.panel2{fill:#202631;stroke:#424957;stroke-width:1}.chip{fill:#fff}.small{font-size:12px;font-weight:800}.xs{font-size:9px;font-weight:800}.h1{font-size:44px;font-weight:900;letter-spacing:-2px}.h2{font-size:22px;font-weight:900}.h3{font-size:16px;font-weight:900}.num{font-size:26px;font-weight:900}</style>
</defs>
<rect width="1200" height="760" rx="0" fill="url(#bg)"/>
<g opacity=".22"><circle cx="1110" cy="80" r="210" fill="#d71920"/><circle cx="50" cy="710" r="220" fill="#d71920"/></g>
<g transform="translate(46 46)"><path d="M0 64 34 0l34 64h-15L34 25 15 64z" fill="#fff"/><path d="M17 64 34 32l17 32H38l-4-9-4 9z" fill="#d71920"/><text class="t white" x="90" y="34" font-size="34" font-weight="900">ARSENAL</text><text class="t muted" x="94" y="55" font-size="10" font-weight="800" letter-spacing="9">MEDIA</text></g>
<text class="t white h1" x="46" y="180">Arsenal Staff Commander</text>
<rect x="46" y="210" width="86" height="5" rx="3" fill="#d71920"/>
<text class="t muted" x="46" y="252" font-size="22">One place for staff operations, approvals, payroll,</text>
<text class="t muted" x="46" y="284" font-size="22">employee training, reports, and daily visibility.</text>
<g transform="translate(46 330)">
<g><circle r="24" cx="24" cy="24" fill="#d71920"/><text class="t white" x="64" y="20" font-size="18" font-weight="900">Operations</text><text class="t muted" x="64" y="43" font-size="14">Dashboard visibility</text></g>
<g transform="translate(0 82)"><circle r="24" cx="24" cy="24" fill="#d71920"/><text class="t white" x="64" y="20" font-size="18" font-weight="900">Approvals</text><text class="t muted" x="64" y="43" font-size="14">Bulk review workflows</text></g>
<g transform="translate(0 164)"><circle r="24" cx="24" cy="24" fill="#d71920"/><text class="t white" x="64" y="20" font-size="18" font-weight="900">Training</text><text class="t muted" x="64" y="43" font-size="14">Certifications and reports</text></g>
</g>
<g filter="url(#shadow)">
<rect class="panel" x="380" y="42" width="760" height="340" rx="18"/>
<rect x="402" y="66" width="140" height="26" rx="7" fill="#d71920"/><text class="t white xs" x="418" y="83">OPERATIONS DASHBOARD</text>
<text class="t white h2" x="402" y="124">One command center for daily management.</text>
<g transform="translate(402 154)"><rect class="chip" width="104" height="68" rx="10"/><text class="t muted xs" x="12" y="20">SUBMISSIONS</text><text class="t" x="12" y="50" font-size="28" font-weight="900" fill="#111827">61</text></g>
<g transform="translate(520 154)"><rect class="chip" width="104" height="68" rx="10"/><text class="t muted xs" x="12" y="20">PENDING</text><text class="t" x="12" y="50" font-size="28" font-weight="900" fill="#111827">12</text></g>
<g transform="translate(638 154)"><rect class="chip" width="104" height="68" rx="10"/><text class="t muted xs" x="12" y="20">APPROVED</text><text class="t" x="12" y="50" font-size="28" font-weight="900" fill="#111827">42</text></g>
<g transform="translate(756 154)"><rect class="chip" width="128" height="68" rx="10"/><text class="t muted xs" x="12" y="20">PAYROLL VIEW</text><text class="t" x="12" y="50" font-size="28" font-weight="900" fill="#111827">$12.6k</text></g>
<rect class="panel2" x="402" y="246" width="320" height="104" rx="12"/><text class="t white h3" x="420" y="277">Submission Status</text><rect x="420" y="298" width="250" height="9" rx="5" fill="#4b5563"/><rect x="420" y="298" width="156" height="9" rx="5" fill="url(#redblue)"/><rect x="420" y="326" width="250" height="9" rx="5" fill="#4b5563"/><rect x="420" y="326" width="98" height="9" rx="5" fill="url(#redblue)"/>
<rect class="panel2" x="744" y="246" width="356" height="104" rx="12"/><text class="t white h3" x="762" y="277">Outstanding Actions</text><text class="t muted" x="762" y="306" font-size="14">• 2 approvals waiting</text><text class="t muted" x="762" y="332" font-size="14">• 1 missing-rate warning</text>
</g>
<g filter="url(#shadow)">
<rect class="panel" x="380" y="410" width="350" height="250" rx="16"/><text class="t white h2" x="404" y="446">Work Submissions</text><rect x="404" y="470" width="300" height="28" rx="7" fill="#fff" opacity=".95"/><text class="t" x="418" y="489" font-size="12" fill="#111827" font-weight="900">Team member  Job type  Status  Amount</text><g transform="translate(404 520)"><rect width="300" height="28" rx="7" fill="#252c37"/><text class="t white small" x="12" y="19">Taylor Brooks</text><text class="t muted xs" x="130" y="19">Commercial Service</text><rect x="244" y="8" width="42" height="13" rx="7" fill="#f59e0b"/></g><g transform="translate(404 558)"><rect width="300" height="28" rx="7" fill="#252c37"/><text class="t white small" x="12" y="19">Casey Bennett</text><text class="t muted xs" x="130" y="19">Residential</text><rect x="244" y="8" width="42" height="13" rx="7" fill="#22c55e"/></g><g transform="translate(404 596)"><rect width="300" height="28" rx="7" fill="#252c37"/><text class="t white small" x="12" y="19">Morgan Davis</text><text class="t muted xs" x="130" y="19">Equipment</text><rect x="244" y="8" width="42" height="13" rx="7" fill="#d71920"/></g>
<rect class="panel" x="758" y="410" width="382" height="250" rx="16"/><text class="t white h2" x="782" y="446">Employee Training</text><g transform="translate(782 470)"><rect class="panel2" width="150" height="70" rx="10"/><text class="t white small" x="12" y="22">Alex Morgan</text><rect x="12" y="42" width="120" height="8" rx="4" fill="#4b5563"/><rect x="12" y="42" width="120" height="8" rx="4" fill="url(#redblue)"/></g><g transform="translate(950 470)"><rect class="panel2" width="150" height="70" rx="10"/><text class="t white small" x="12" y="22">Jordan Lee</text><rect x="12" y="42" width="120" height="8" rx="4" fill="#4b5563"/><rect x="12" y="42" width="96" height="8" rx="4" fill="url(#redblue)"/></g><g transform="translate(782 560)"><rect class="panel2" width="150" height="70" rx="10"/><text class="t white small" x="12" y="22">Taylor Brooks</text><rect x="12" y="42" width="120" height="8" rx="4" fill="#4b5563"/><rect x="12" y="42" width="72" height="8" rx="4" fill="url(#redblue)"/></g><g transform="translate(950 560)"><rect class="panel2" width="150" height="70" rx="10"/><text class="t white small" x="12" y="22">Riley Foster</text><rect x="12" y="42" width="120" height="8" rx="4" fill="#4b5563"/><rect x="12" y="42" width="102" height="8" rx="4" fill="url(#redblue)"/></g></g>
</svg>