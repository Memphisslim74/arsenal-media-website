<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Arsenal Staff Commander submissions approvals and payroll preview</title><desc id="desc">A dark interface showing work submissions, bulk approvals, approval history, and payroll visibility.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07080b"/><stop offset=".75" stop-color="#151b25"/><stop offset="1" stop-color="#3a0b14"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif}.white{fill:#f8fafc}.muted{fill:#aeb8c8}.panel{fill:#1a202b;stroke:#3b4351;stroke-width:1.4}.head{fill:#414854}.row{fill:#232a35}.red{fill:#d71920}.green{fill:#22c55e}.gold{fill:#f59e0b}.bad{fill:#8c2530}.xs{font-size:10px;font-weight:900;letter-spacing:.08em}.h2{font-size:26px;font-weight:900}.small{font-size:13px;font-weight:800}</style></defs><rect width="1200" height="675" fill="url(#bg)"/><text class="t white" x="46" y="60" font-size="34" font-weight="900">Arsenal Staff Commander</text><text class="t muted" x="46" y="86" font-size="16">Work submissions, approvals, and payroll visibility</text><rect class="panel" x="46" y="126" width="680" height="250" rx="14"/><text class="t white h2" x="70" y="166">Work Submissions</text><rect x="70" y="188" width="132" height="34" rx="8" fill="#fff"/><text class="t" x="86" y="210" fill="#111827" font-size="13" font-weight="800">All statuses</text><rect x="214" y="188" width="160" height="34" rx="8" fill="#fff"/><text class="t" x="230" y="210" fill="#111827" font-size="13" font-weight="800">Export Demo CSV</text><g transform="translate(70 244)"><rect class="head" width="620" height="34" rx="8"/><text class="t muted xs" x="16" y="22">TEAM MEMBER</text><text class="t muted xs" x="166" y="22">JOB TYPE</text><text class="t muted xs" x="328" y="22">STATUS</text><text class="t muted xs" x="458" y="22">AMOUNT</text><g transform="translate(0 44)"><rect class="row" width="620" height="38" rx="7"/><tex