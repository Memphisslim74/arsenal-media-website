<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Arsenal Staff Commander operations dashboard screenshot style preview</title><desc id="desc">Operations dashboard with navigation, KPI totals, status bars, outstanding actions, and recent activity.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07080b"/><stop offset=".7" stop-color="#111722"/><stop offset="1" stop-color="#320b13"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#d71920"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif}.white{fill:#f8fafc}.muted{fill:#aeb8c8}.panel{fill:#1a202b;stroke:#3a4250;stroke-width:1.5}.nav{fill:#f5f5f6}.dark{fill:#252b36}.small{font-size:12px;font-weight:800}.xs{font-size:10px;font-weight:900;letter-spacing:.08em}.h1{font-size:39px;font-weight:900;letter-spacing:-1.6px}.h2{font-size:22px;font-weight:900}.num{font-size:29px;font-weight:900}</style></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="24" y="24" width="1152" height="86" rx="14" fill="#070b11" stroke="#353b46"/><text class="t white" x="54" y="72" font-size="28" font-weight="900">Arsenal Staff Commander</text><text class="t muted xs" x="54" y="92">OPERATIONS & TRAINING COMMAND CENTER</text><rect x="24" y="132" width="188" height="490" rx="14" fill="#161c26" stroke="#3a4250"/><g transform="translate(44 154)"><rect class="nav" width="148" height="30" rx="7"/><text class="t" x="14" y="20" fill="#111827" font-size="13" font-weight="900">Operations Dashboard</text><rect class="nav" y="42" width="148" height="30" rx="7"/><text class="t" x="14" y="62" fill="#111827" font-size="13" font-weight="900">Work Submissions</text><rect class="nav" y="84" width="148" height="30" rx="7"/><text class="t" x="14" y="104" fill="#111827" font-size="13" font-weight="900">Approvals</text><rect class="nav" y="126" width="148" height="30" rx="7"/><text class="t" x="14" y="146" fill="#111827" font-size="13" font-weight="900">Team Payroll</text><rect class="nav" y="168" width="148" height="30" rx="7"/><text class="t" x="14" y="188" fill="#111827" font-size="13" font-weight="900">Employee Training</text><rect class="nav" y="210" width="148" height="30" rx="7"/><text class="t" x="14" y="230" fill="#111827" font-size="13" font-weight="900">Reports</text></g><rect class="panel" x="236" y="132" width="916" height="250" rx="14"/><text class="t muted xs" x="262" y="170">OPERATIONS DASHBOARD</text><text class="t white h1" x="262" y="220">One place for staff operations,</text><text class="t white h1" x="262" y="263">approvals, payroll, and training.</text><text class="t muted" x="262" y="304" font-size="16">A command center for daily visibility across synthetic service-team records.</text><g transform="translate(720 158)"><rect class="dark" width="370" height="52" rx="10"/><text class="t white small" x="14" y="23">Fully white-labeled</text><text class="t muted" x="14" y="42" font-size="12">No production data, branding, APIs, or credentials.</text><rect class="dark" y="64" width="370" height="52" rx="10"/><text class="t white small" x="14" y="87">Role-aware</text><text class="t muted" x="14" y="106" font-size="12">Owner/Admin, Manager, and Team Member views.</text></g><g transform="translate(236 404)"><g><rect width="140" height="70" rx="10" fill="#fff"/><text class="t muted xs" x="14" y="22">TOTAL SUBMISSIONS</text><text class="t" x="14" y="52" fill="#111827" font-size="30" font-weight="900">5</text></g><g transform="translate(154 0)"><rect width="140" height="70" rx="10" fill="#fff"/><text class="t muted xs" x="14" y="22">PENDING</text><text class="t" x="14" y="52" fill="#111827" font-size="30" font-weight="900">2</text></g><g transform="translate(308 0)"><rect width="140" height="70" rx="10" fill="#fff"/><text class="t muted xs" x="14" y="22">APPROVED</text><text class="t" x="14" y="52" fill="#111827" font-size="30" font-weight="900">2</text></g><g transform="translate(462 0)"><rect width="160" height="70" rx="10" fill="#fff"/><text class="t muted xs" x="14" y="22">TOTAL JOB PAY</text><text class="t" x="14" y="52" fill="#111827" font-size="30" font-weight="900">$1,390</text></g><g transform="translate(636 0)"><rect width="140" height="70" rx="10" fill="#fff"/><text class="t muted xs" x="14" y="22">TRAINING RATE</text><text class="t" x="14" y="52" fill="#111827" font-size="30" font-weight="900">75%</text></g></g><rect class="panel" x="236" y="500" width="438" height="122" rx="14"/><text class="t white h2" x="260" y="536">Submission Status Chart</text><text class="t muted small" x="260" y="568">Approved 2</text><rect x="350" y="557" width="250" height="9" rx="5" fill="#4b5563"/><rect x="350" y="557" width="152" height="9" rx="5" fill="url(#accent)"/><text class="t muted small" x="260" y="598">Pending 2</text><rect x="350" y="587" width="250" height="9" rx="5" fill="#4b5563"/><rect x="350" y="587" width="152" height="9" rx="5" fill="url(#accent)"/><rect class="panel" x="698" y="500" width="454" height="122" rx="14"/><text class="t white h2" x="722" y="536">Outstanding Actions</text><text class="t muted" x="722" y="568" font-size="15">2 approvals waiting</text><text class="t muted" x="722" y="596" font-size="15">1 missing-rate warning</text></svg>