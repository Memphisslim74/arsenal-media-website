:root{--bg:#07080b;--panel:#121722;--panel2:#1b2230;--panel3:#252b36;--text:#f8fafc;--muted:#aeb8c8;--line:rgba(255,255,255,.12);--red:#d71920;--red2:#b11118;--blue:#3b82f6;--green:#22c55e;--gold:#f59e0b;--radius:9px;--shadow:0 20px 70px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top right,rgba(215,25,32,.2),transparent 32%),linear-gradient(135deg,#07080b,#101722 60%,#07080b);color:var(--text)}.wrap{width:min(1560px,calc(100% - 28px));margin:0 auto;padding:16px 0 26px}.top{position:sticky;top:10px;z-index:10;background:rgba(10,13,19,.92);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;align-items:center;gap:14px}.brand img{width:205px}.brandText small{display:block;color:#ffb4b9;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:950}.brandText h1{margin:3px 0 0;font-size:clamp(24px,3vw,36px);letter-spacing:-.04em;line-height:1}.previewLabel{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#dbe4f0;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.role{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.role strong{display:block}.muted,.role span,.card p,.hero p{color:var(--muted);line-height:1.6}.roleBtns,.actions,.nav,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,button{font:inherit;border:0;border-radius:var(--radius);padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.primary{background:var(--red);color:#fff}.primary:hover{background:var(--red2)}.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line)}.light,.roleBtn.active,.nav button.active{background:#fff;color:#111827}.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.nav{position:sticky;top:106px;align-content:start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:calc(100vh - 122px);overflow:auto}.nav button{width:100%;justify-content:flex-start}.page{display:none}.page.active{display:block}.hero,.card{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.05)}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;margin-bottom:16px}.eyebrow{color:#ffb4b9;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:950}.hero h2{font-size:clamp(34px,4vw,58px);line-height:1;letter-spacing:-.06em;margin:8px 0 12px}.summary{display:grid;gap:10px}.summary div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px}.summary strong{display:block}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.kpi{background:#fff;color:#111827;border-radius:12px;padding:15px}.kpi small{display:block;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:950}.kpi strong{display:block;font-size:30px;margin:6px 0 2px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;min-width:780px;border-collapse:collapse}th{background:rgba(255,255,255,.1);color:#dbe4f0;text-align:left;text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding:12px}td{border-top:1px solid rgba(255,255,255,.08);padding:12px;color:#f2f6fb;font-weight:650}.status{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:950;text-transform:uppercase}.pending{background:rgba(245,158,11,.18);color:#fcd34d}.approved{background:rgba(34,197,94,.18);color:#86efac}.review,.blocked{background:rgba(215,25,32,.18);color:#fecaca}.disabled{background:rgba(148,163,184,.18);color:#cbd5e1}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form input,.form select,.toolbar input,.toolbar select{padding:10px;border-radius:8px;border:1px solid #d6dbe4;font:inherit;min-height:42px}.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue))}.barRow{display:grid;grid-template-columns:160px 1fr 70px;gap:12px;align-items:center;margin:12px 0}.personGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.person{background:rgba(255,255,255,.075);border:1px solid var(--line);border-radius:12px;padding:14px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--blue));font-weight:950}.report{background:#fff;color:#111827;border-radius:14px;padding:18px}.report img{width:190px;filter:invert(1)}.report p{color:#667085}.safeActions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111827;border-radius:10px;padding:14px 16px;font-weight:900;box-shadow:var(--shadow);display:none}.toast.show{display:block}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.footerLinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}.footerLinks a,.footerLinks button{font-size:13px;padding:8px 10px}@media(max-width:1120px){.layout{grid-template-columns:1fr}.nav{position:relative;top:auto;display:flex}.nav button{width:auto}.hero,.grid2,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.wrap{width:min(100% - 16px,1560px)}.top{position:relative;top:auto;align-items:flex-start;flex-direction:column}.brand{align-items:flex-start}.brand img{width:170px}.kpis{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.previewLabel{align-self:flex-start}}@media(max-width:480px){.kpis{grid-template-columns:1fr}}

<body>
<div class="wrap">
<header class="top">
  <div class="brand"><img src="/assets/images/arsenal-logo-white.png" alt="Arsenal Media"><div class="brandText"><small>Operations & Training Command Center</small><h1>Arsenal Staff Commander</h1></div></div>

<section class="role"><div><strong>Public role switcher</strong><span id="roleHelp">Owner/Admin sees all sample records and controls.</span></div><div class="roleBtns"><button class="roleBtn active" data-role="admin">View as Owner/Admin</button><button class="roleBtn secondary" data-role="manager">View as Manager</button><button class="roleBtn secondary" data-role="team">View as Team Member</button></div></section>

<script>
const pages=['Operations Dashboard','Work Submissions','Approvals','Team Payroll','Team Performance','People','Employee Training','Reports','Integrations','Settings'];
const ids=['dashboard','submissions','approvals','payroll','performance','people','training','reports','integrations','settings'];
const seed={people:[['Alex Morgan','Administrator','Active','alex.morgan@example-demo.com',72,100],['Jordan Lee','Manager','Active','jordan.lee@example-demo.com',58,88],['Taylor Brooks','Team Member','Active','taylor.brooks@example-demo.com',42,63],['Casey Bennett','Team Member','Active','casey.bennett@example-demo.com',39,75],['Morgan Davis','Team Member','Active','morgan.davis@example-demo.com',0,50],['Avery Parker','Team Member','Disabled','avery.parker@example-demo.com',36,38],['Cameron Reed','Team Member','Active','cameron.reed@example-demo.com',44,100],['Riley Foster','Team Member','Active','riley.foster@example-demo.com',41,88]],submissions:[['Taylor Brooks','Commercial Service','2026-07-14','09:00','13:30','Pending',315,'North site appointment',''],['Casey Bennett','Residential Service','2026-07-14','10:00','14:00','Approved',260,'Customer follow-up completed','Jordan Lee'],['Morgan Davis','Equipment Delivery','2026-07-15','08:30','11:00','Needs Review',185,'Missing rate warning',''],['Cameron Reed','Training Support','2026-07-15','12:00','16:00','Pending',240,'New-hire practical support',''],['Riley Foster','Commercial Service','2026-07-16','09:00','15:00','Approved',390,'Approved sample record','Alex Morgan']],categories:['Company Orientation','Customer Service Standards','Safety and Incident Reporting','Equipment Handling','Data Privacy Basics','Field Communication','Commercial Service Certification','Supervisor Practical Sign-Off'],history:[['2026-07-15','Taylor Brooks — Commercial Service','Submitted','Taylor Brooks'],['2026-07-15','Casey Bennett — Residential Service','Approved','Jordan Lee'],['2026-07-15','Morgan Davis — Equipment Delivery','Flagged for review','System'],['2026-07-16','Data Privacy Basics','Administrator approval completed','Alex Morgan']],classroom:[['Taylor Brooks','Taylor Brooks','Safety and Incident Reporting','Submitted assignment','Field Communication'],['Casey Bennett','Casey Bennett','Company Orientation','Completed assignment','Data Privacy Basics'],['Morgan Davis','Needs matching','Customer Service Standards','Awaiting review','Equipment Handling'],['Riley Foster','Riley Foster','Field Communication','Incomplete assignment','Supervisor Practical Sign-Off']]};
let data=JSON.parse(localStorage.getItem('ascPreviewData')||'null')||structuredClone(seed), role=localStorage.getItem('ascPreviewRole')||'admin', page=localStorage.getItem('ascPreviewPage')||'dashboard';
const $=s=>document.querySelector(s), money=n=>'$'+Number(n).toLocaleString(), toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}, visibleSubs=()=>role==='team'?data.submissions.filter(r=>r[0]==='Taylor Brooks'):data.submissions, approved=()=>visibleSubs().filter(r=>r[5]==='Approved'), pending=()=>visibleSubs().filter(r=>r[5]==='Pending'), personByName=n=>data.people.find(p=>p[0]===n)||[];
function init(){document.querySelectorAll('.roleBtn').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.onclick=()=>{role=b.dataset.role;localStorage.setItem('ascPreviewRole',role);page='dashboard';render()}});$('#roleHelp').textContent=role==='admin'?'Owner/Admin sees all sample records and controls.':role==='manager'?'Manager sees team records, approval queues, training, and reports with self-approval restrictions.':'Team Member sees personal submissions, payroll view, and training progress.';$('#resetDemo').onclick=()=>{localStorage.removeItem('ascPreviewData');data=structuredClone(seed);toast('Sample data reset');render()};$('#tourBtn').onclick=()=>toast('Tour: switch roles, approve sample records, view training, then open reports.');renderNav();renderMain();}
function render(){localStorage.setItem('ascPreviewData',JSON.stringify(data));localStorage.setItem('ascPreviewPage',page);init()}
function renderNav(){const nav=$('#nav');nav.innerHTML=pages.map((p,i)=>`<button class="${ids[i]===page?'active':'secondary'}" onclick="page='${ids[i]}';renderMain();renderNav();localStorage.setItem('ascPreviewPage',page)">${p}</button>`).join('')}
function renderMain(){const main=$('#main');main.innerHTML=views[page]();bind()}
const status=s=>`<span class="status ${s==='Approved'?'approved':s==='Pending'?'pending':'review'}">${s}</span>`;
const table=(heads,rows)=>`<div class="tableWrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
const views={dashboard(){const subs=visibleSubs(), total=subs.reduce((a,r)=>a+r[6],0), rate=Math.round(data.people.reduce((a,p)=>a+p[5],0)/data.people.length);return `<section class="hero"><div><span class="eyebrow">Operations & Training Command Center</span><h2>One place for staff operations, approvals, payroll visibility, and employee training.</h2><p>This public preview uses only fictional Arsenal Service Group records. It shows how scattered spreadsheets, email approvals, shared documents, and disconnected learning systems can become one focused command center.</p></div><div class="summary"><div><strong>White-labeled product preview</strong><span class="muted">No production branding, records, APIs, credentials, or learning accounts.</span></div><div><strong>Role-aware</strong><span class="muted">Owner/Admin, Manager, and Team Member views change navigation, records, and actions.</span></div><div><strong>State persistence</strong><span class="muted">The selected tab is saved in local browser storage only.</span></div></div></section><div class="kpis"><div class="kpi"><small>Total submissions</small><strong>${subs.length}</strong><span>Current role view</span></div><div class="kpi"><small>Pending approvals</small><strong>${pending().length}</strong><span>Needs review</span></div><div class="kpi"><small>Approved</small><strong>${approved().length}</strong><span>Ready for payroll</span></div><div class="kpi"><small>Total job pay</small><strong>${money(total)}</strong><span>Fictional</span></div><div class="kpi"><small>Training rate</small><strong>${rate}%</strong><span>Role average</span></div><div class="kpi"><small>Reports</small><strong>4</strong><span>Sample exports</span></div></div><div class="grid2"><div class="card"><h3>Submission Status Chart</h3>${['Approved','Pending','Needs Review'].map(s=>{let n=subs.filter(r=>r[5]===s).length;return `<div class="barRow"><b>${s} ${n}</b><div class="bar"><span style="width:${Math.max(12,n*24)}%"></span></div><span>${n}</span></div>`}).join('')}</div><div class="card"><h3>Outstanding Actions</h3><p>${pending().length} approvals waiting</p><p>${data.people.filter(p=>p[4]===0).length} missing-rate warning</p><p>${data.people.filter(p=>p[5]<90).length} training follow-ups</p></div></div><div class="card" style="margin-top:16px"><h3>Recent Activity</h3>${table(['Date','Activity','By'],data.history.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} — ${r[2]}</td><td>${r[3]}</td></tr>`).join(''))}</div>`},submissions(){return `<div class="card"><div class="toolbar"><input type="date"><input type="date"><select><option>All statuses</option><option>Pending</option><option>Approved</option></select><button class="secondary" onclick="toast('CSV export simulated')">Export Demonstration</button></div><h3>Work Submissions</h3>${table(['Team Member','Job Type','Date','Start','End','Status','Amount','Notes','Approved By'],visibleSubs().map(r=>`<tr>${r.map((c,i)=>`<td>${i===5?status(c):i===6?money(c):c||'—'}</td>`).join('')}</tr>`).join(''))}</div>${role==='team'?`<div class="card" style="margin-top:16px"><h3>Create or edit a synthetic submission</h3><div class="form"><select id="job"><option>Commercial Service</option><option>Residential Service</option><option>Training Support</option></select><input type="date" id="date"><input type="number" id="amount" value="240"><button class="primary" id="addSub">Save Synthetic Submission</button></div></div>`:''}`},approvals(){return `<div class="card"><div class="toolbar"><button class="secondary" onclick="document.querySelectorAll('.pick').forEach(c=>c.checked=!c.disabled);countSel()">Select all eligible records</button><button class="primary" id="approveSel">Approve selected</button><button class="secondary" onclick="document.querySelectorAll('.pick').forEach(c=>c.checked=false);countSel()">Clear selection</button><span class="muted" id="selectedCounter">0 selected</span></div><h3>Approvals</h3><p>Managers cannot approve their own records. Administrators can approve any eligible sample record.</p>${table(['Select','Team Member','Job Type','Date','Status','Amount','Action'],visibleSubs().map((r,i)=>{let eligible=r[5]!=='Approved'&&(role==='admin'||r[0]!=='Jordan Lee');return `<tr><td>${eligible?`<input class="pick" type="checkbox" data-i="${i}" onchange="countSel()">`:'—'}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${status(r[5])}</td><td>${money(r[6])}</td><td>${eligible?`<button class="primary" onclick="approveOne(${i})">Approve</button>`:status('Approved')}</td></tr>`}).join(''))}</div><div class="card" style="margin-top:16px"><h3>Approval History</h3>${table(['Date','Record','Action','By'],data.history.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join(''))}</div>`},payroll(){let subs=visibleSubs();return `<div class="card"><div class="toolbar"><select><option>All team members</option>${data.people.map(p=>`<option>${p[0]}</option>`).join('')}</select><input type="date"><input type="date"><select><option>All statuses</option><option>Approved</option><option>Pending</option></select><button class="secondary" onclick="toast('Payroll CSV export simulated')">CSV Export Simulation</button></div><h3>Team Payroll</h3><div class="kpis"><div class="kpi"><small>Approved pay</small><strong>${money(approved().reduce((a,r)=>a+r[6],0))}</strong><span>Fictional</span></div><div class="kpi"><small>Pending pay</small><strong>${money(pending().reduce((a,r)=>a+r[6],0))}</strong><span>Needs approval</span></div><div class="kpi"><small>Missing rates</small><strong>${data.people.filter(p=>p[4]===0).length}</strong><span>Warning flags</span></div></div>${table(['Team Member','Rate','Hours / Count','Status','Amount','Warning'],subs.map(r=>{let p=personByName(r[0]);return `<tr><td>${r[0]}</td><td>${p[4]?money(p[4])+'/hr':'—'}</td><td>${r[1].includes('Commercial')?'1 job':'4 hrs'}</td><td>${status(r[5])}</td><td>${money(r[6])}</td><td>${p[4]?'—':'<span class="status blocked">Missing rate</span>'}</td></tr>`}).join(''))}</div>`},performance(){return `<div class="card"><div class="toolbar"><input type="date"><input type="date"><button class="secondary" onclick="toast('Performance export simulated')">Export Performance Demo</button></div><h3>Team Performance</h3>${data.people.filter(p=>p[1]==='Team Member').map(p=>`<div class="barRow"><b>${p[0]}</b><div class="bar"><span style="width:${p[5]}%"></span></div><span>${p[5]}%</span></div>`).join('')}</div>`},people(){return `<div class="card"><div class="toolbar"><input placeholder="Search"><select><option>All roles</option><option>Administrator</option><option>Manager</option><option>Team Member</option></select><select><option>All statuses</option><option>Active</option><option>Disabled</option></select></div><h3>People</h3><div class="personGrid">${data.people.map(p=>`<div class="person"><div class="avatar">${p[0].split(' ').map(x=>x[0]).join('')}</div><h3>${p[0]}</h3><p>${p[1]}<br>${p[3]}</p><span class="status ${p[2]==='Active'?'approved':'disabled'}">${p[2]}</span><div class="bar" style="margin:12px 0"><span style="width:${p[5]}%"></span></div><p>${p[5]}% training complete</p><button class="secondary" onclick="toast('Edit user simulated')">Edit User</button> <button class="secondary" onclick="page='training';renderMain();renderNav()">Manage Training</button></div>`).join('')}</div></div>`},training(){let people=role==='team'?data.people.filter(p=>p[0]==='Taylor Brooks'):data.people;return `<div class="card"><div class="toolbar"><input placeholder="Search training roster"><select><option>All training statuses</option><option>Complete</option><option>In progress</option></select><button class="secondary" onclick="page='reports';renderMain();renderNav()">Workforce Training Report</button></div><h3>${role==='team'?'My Training Progress':'Employee Training'}</h3><div class="personGrid">${people.map(p=>`<div class="person"><h3>${p[0]}</h3><p>${p[1]} • ${p[3]}</p><div class="bar" style="margin:12px 0"><span style="width:${p[5]}%"></span></div><p>${p[5]}% complete • ${Math.round(p[5]/100*7)} of 7 required items</p><button class="secondary" onclick="toast('Supervisor sign-off simulated')">Supervisor Sign-Off</button> <button class="secondary" onclick="toast('Training reopened for review')">Reopen Training</button></div>`).join('')}</div></div>${role==='admin'?`<div class="card" style="margin-top:16px"><h3>Training Type Manager</h3><p>Add, rename, reorder, disable, or require administrator approval for sample categories.</p><div class="form"><input id="cat" placeholder="New training category"><input placeholder="Description"><select><option>Required</option><option>Optional</option></select><button class="primary" onclick="toast('Category added in demo')">Add Category</button></div>${table(['Order','Category','Required','Approval','Status'],data.categories.map((c,i)=>`<tr><td>${i+1}</td><td>${c}</td><td>${i<6?'Yes':'Optional'}</td><td>${i===4||i===7?'Administrator':'Supervisor'}</td><td>${status('Approved')}</td></tr>`).join(''))}</div>`:''}`},reports(){return `<div class="grid3"><button class="primary" onclick="report('employee')">Employee Training Report</button><button class="primary" onclick="report('workforce')">Workforce Training Report</button><button class="primary" onclick="report('operations')">Operations Summary</button><button class="primary" onclick="report('payroll')">Payroll Summary</button></div><div class="report" id="reportBox" style="margin-top:16px"><img src="/assets/images/arsenal-logo-white.png" alt="Arsenal Media"><h3>Employee Training Report</h3><p>Arsenal Service Group • Synthetic sample report</p><p>Alex Morgan • alex.morgan@example-demo.com</p><p>Completion: 100%</p><p>Designed and built by Arsenal Media. This report uses fictional preview records only.</p></div>`},integrations(){return `<div class="grid2"><div class="card"><span class="eyebrow">Simulated Google Classroom</span><h3>Connected learning progress</h3><p>This does not connect to production Google Classroom. It uses fictional Classroom data only.</p><div class="summary"><div><strong>Connected sample account</strong><span class="muted">training-admin@example-demo.com</span></div><div><strong>Selected sample course</strong><span class="muted">Arsenal Service Group — Employee Foundations</span></div><div><strong>Last synchronized</strong><span class="muted" id="lastSync">Today at 9:42 AM</span></div></div><div class="safeActions"><button class="primary" onclick="document.getElementById('lastSync').textContent='Just now';toast('Classroom sync simulated')">Sync Now</button><button class="secondary">Review Matches</button><button class="secondary">Change Course</button><button class="secondary">Reconnect</button><button class="secondary">Open Classroom</button></div></div><div class="card"><h3>Integration Health</h3><div class="summary"><div><strong>Automatic email matching</strong><span class="muted">5 users matched by @example-demo.com address.</span></div><div><strong>Manual profile matching</strong><span class="muted">1 fictional student needs review.</span></div><div><strong>Training items</strong><span class="muted">Assignments are mapped to training categories.</span></div></div></div></div><div class="card" style="margin-top:16px"><h3>Classroom Progress</h3>${table(['Student','Matched User','Assignment','Status','Next Assignment'],data.classroom.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${status(r[3].includes('Completed')?'Approved':r[3].includes('Incomplete')?'Needs Review':'Pending')}</td><td>${r[4]}</td></tr>`).join(''))}</div>`},settings(){return `<div class="grid2"><div class="card"><h3>Safety & Isolation</h3><div class="summary"><div><strong>Sample data only</strong><span class="muted">All records are generated inside this page or local browser storage.</span></div><div><strong>No outbound email</strong><span class="muted">Buttons simulate reports and exports but do not send email.</span></div><div><strong>No production credentials</strong><span class="muted">No Supabase keys, OAuth clients, Classroom tokens, or API endpoints are embedded.</span></div><div><strong>No real personal information</strong><span class="muted">Every user, email, payroll amount, and training record is fictional.</span></div></div></div><div class="card"><h3>Build Something Similar</h3><p>For a real implementation, Arsenal Media would use a separate hosting project, database, environment variables, role-based access, anti-bot protection, rate limiting, and approved outbound email routes.</p><div class="safeActions"><a class="btn primary" href="/contact.html">Request a Workflow Review</a><a class="btn secondary" href="/portfolio/operations-training-command-center/">Read Case Study</a><button class="secondary" onclick="toast('Guided tour: dashboard, approvals, payroll, training, reports.')">Guided Tour</button><button class="secondary" onclick="localStorage.removeItem('ascPreviewData');data=structuredClone(seed);toast('Sample data reset');render()">Reset Sample Data</button></div></div></div>`}};
function bind(){if(page==='submissions'&&$('#addSub'))$('#addSub').onclick=()=>{data.submissions.push(['Taylor Brooks',$('#job').value,$('#date').value||'2026-07-18','09:00','13:00','Pending',Number($('#amount').value||0),'Added in browser preview','']);toast('Synthetic submission saved');renderMain()};if(page==='approvals'&&$('#approveSel'))$('#approveSel').onclick=()=>{document.querySelectorAll('.pick:checked').forEach(c=>approveOne(Number(c.dataset.i),true));toast('Selected records approved');renderMain()}}
function countSel(){const n=document.querySelectorAll('.pick:checked').length;const el=$('#selectedCounter');if(el)el.textContent=n+' selected'}
function approveOne(i,silent=false){let vis=visibleSubs(), rec=vis[i], original=data.submissions.find(r=>r===rec);if(original){original[5]='Approved';original[8]=role==='admin'?'Alex Morgan':'Jordan Lee';data.history.unshift(['2026-07-27',original[0]+' — '+original[1],'Approved',original[8]]);localStorage.setItem('ascPreviewData',JSON.stringify(data));if(!silent)toast('Record approved');renderMain()}}
function report(type){const title={employee:'Employee Training Report',workforce:'Workforce Training Report',operations:'Operations Summary',payroll:'Payroll Summary'}[type];$('#reportBox').innerHTML=`<img src="/assets/images/arsenal-logo-white.png" alt="Arsenal Media"><h3>${title}</h3><p>Arsenal Service Group • Synthetic sample report</p><p>Total submissions: ${visibleSubs().length}</p><p>Training rate: ${Math.round(data.people.reduce((a,p)=>a+p[5],0)/data.people.length)}%</p><p>Designed and built by Arsenal Media. This report uses fictional preview records only.</p>`}
init();
</script>
